<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" role="img" aria-labelledby="title desc">
  <title id="title">Console Launcher</title>
  <desc id="desc">Console Launcher, a focused Rust and Qt QML desktop application.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08111f"/><stop offset="1" stop-color="#101b3b"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#5cc8ff"/><stop offset="1" stop-color="#7c8cff"/></linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="24"/></filter>
  </defs>
  <rect width="760" height="240" rx="20" fill="url(#bg)"/>
  <circle cx="670" cy="40" r="130" fill="#2563eb" opacity=".16" filter="url(#blur)"/>
  <path d="M0 204H760" stroke="#5cc8ff" stroke-opacity=".25"/>
  <g transform="translate(48 55)">
    <rect width="46" height="46" rx="12" fill="#5cc8ff" fill-opacity=".12" stroke="#5cc8ff" stroke-opacity=".55"/>
    <path d="m15 17 10 10-10 10M29 37h10" fill="none" stroke="#b9e8ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="66" y="24" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="27" font-weight="700">Console Launcher</text>
    <text x="66" y="52" fill="#9bd7ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" letter-spacing="2">DESKTOP SOFTWARE</text>
  </g>
  <text x="48" y="153" fill="#cbd5e1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">A focused launcher for fast, keyboard-first workflows.</text>
  <text x="48" y="190" fill="#7dd3fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" letter-spacing="1">RUST  ·  QT / QML  ·  DESKTOP</text>
  <path d="M670 184h34" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/><path d="m697 177 7 7-7 7" fill="none" stroke="#b9e8ff" stroke-width="2"/>
