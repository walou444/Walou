<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">Kloups Studio</title>
  <desc id="description">A dark midnight-blue banner with the Kloups wordmark and a subtle electric violet orbit.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050816"/>
      <stop offset="0.55" stop-color="#0b1633"/>
      <stop offset="1" stop-color="#160d2d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow" cx="75%" cy="35%" r="65%">
      <stop offset="0" stop-color="#4169e1" stop-opacity=".25"/>
      <stop offset="1" stop-color="#4169e1" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="30"/></filter>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#background)"/>
  <rect width="1200" height="360" rx="24" fill="url(#glow)"/>
  <circle cx="900" cy="80" r="115" fill="#6d5dfc" opacity=".14" filter="url(#blur)"/>
  <g fill="none" stroke="url(#accent)" opacity=".55">
    <ellipse cx="930" cy="182" rx="215" ry="78" transform="rotate(-18 930 182)" stroke-width="1"/>
    <ellipse cx="930" cy="182" rx="215" ry="78" transform="rotate(42 930 182)" stroke-width="1"/>
    <circle cx="930" cy="182" r="4" fill="#a78bfa" stroke="none"/>
  </g>
  <path d="M88 276H1112" stroke="url(#accent)" stroke-width="1" opacity=".35"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="88" y="156" fill="#f8fafc" font-size="76" font-weight="700" letter-spacing="-3">KLOUPS</text>
    <text x="92" y="201" fill="#93c5fd" font-size="18" font-weight="600" letter-spacing="5">STUDIO / SOFTWARE / DESIGN</text>
    <text x="92" y="315" fill="#94a3b8" font-size="15" letter-spacing="2">RENNES · FRANCE</text>
  </g>
</svg>
