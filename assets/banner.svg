<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 430" role="img" aria-labelledby="title description">
  <title id="title">KLOUPS — software, design and infrastructure</title>
  <desc id="description">A midnight blue studio banner with a luminous KLOUPS wordmark, layered orbital geometry and a subtle animated signal.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050816"/>
      <stop offset=".52" stop-color="#0b1530"/>
      <stop offset="1" stop-color="#170d2d"/>
    </linearGradient>
    <linearGradient id="wordmark" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#f8fbff"/>
      <stop offset=".52" stop-color="#b9ddff"/>
      <stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#5cc8ff" stop-opacity="0"/>
      <stop offset=".35" stop-color="#5cc8ff"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="halo" cx=".78" cy=".35" r=".7">
      <stop stop-color="#4569ff" stop-opacity=".3"/>
      <stop offset=".5" stop-color="#4569ff" stop-opacity=".08"/>
      <stop offset="1" stop-color="#4569ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="32"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="5"/></filter>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#93c5fd" stroke-opacity=".07"/>
    </pattern>
  </defs>
  <rect width="1400" height="430" rx="28" fill="url(#bg)"/>
  <rect width="1400" height="430" rx="28" fill="url(#halo)"/>
  <rect x="1" y="1" width="1398" height="428" rx="27" fill="url(#grid)" opacity=".7"/>
  <circle cx="1095" cy="142" r="155" fill="#6d5dfc" opacity=".13" filter="url(#blur)"/>
  <g transform="translate(1070 215)" fill="none" stroke="url(#line)">
    <ellipse rx="292" ry="104" transform="rotate(-18)" stroke-width="1.5" opacity=".7"/>
    <ellipse rx="292" ry="104" transform="rotate(42)" stroke-width="1" opacity=".44"/>
    <ellipse rx="225" ry="78" transform="rotate(78)" stroke-width="1" opacity=".35"/>
    <circle r="5" fill="#b9ddff" stroke="none"/>
    <circle r="18" stroke="#5cc8ff" stroke-opacity=".28"/>
    <circle r="5" fill="#b9ddff" stroke="none" opacity=".3">
      <animate attributeName="r" values="5;24;5" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".4;0;.4" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g fill="#b9ddff">
    <circle cx="1270" cy="80" r="2"><animate attributeName="opacity" values=".2;1;.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="1208" cy="324" r="2" opacity=".55"/>
    <circle cx="1018" cy="92" r="1.5" opacity=".5"/>
  </g>
  <path d="M92 332H1308" stroke="url(#line)" stroke-width="1"/>
  <path d="M92 332H360" stroke="#5cc8ff" stroke-width="3"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="92" y="178" fill="url(#wordmark)" font-size="108" font-weight="800" letter-spacing="10">KLOUPS</text>
    <text x="99" y="225" fill="#9bd7ff" font-size="18" font-weight="600" letter-spacing="6">SOFTWARE  /  DESIGN  /  INFRASTRUCTURE</text>
    <text x="99" y="383" fill="#94a3b8" font-size="14" letter-spacing="3">INDEPENDENT DIGITAL STUDIO · RENNES, FRANCE</text>
  </g>
</svg>
